services:
  ti-platform:
    build: .
    image: enterprise-cyber-risk-ti-platform:1.0.0
    env_file:
      - .env
    ports:
      - "127.0.0.1:4100:4100"
    volumes:
      - ti-platform-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  ti-platform-data:
